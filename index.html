<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Devanshu Singhvi — systems, security, data lineage. AI engineer building infrastructure-grade tools." />
    <meta property="og:title" content="Devanshu Singhvi" />
    <meta property="og:description" content="Systems, security, and data lineage." />
    <meta property="og:type" content="website" />
    <title>Devanshu Singhvi</title>
    <link rel="shortcut icon" href="./assets/images/berserk.jpg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <a href="#main-content" class="sr-only">Skip to content</a>

    <nav class="nav" id="nav" aria-label="Primary">
      <span class="nav-brand">DS</span>
      <div class="nav-links" id="nav-links"></div>
    </nav>

    <header class="hero" id="hero">
      <div class="hero-landscape" id="hero-landscape" aria-hidden="true"></div>
      <div class="hero-content" id="hero-content">
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-degree" id="hero-degree"></p>
        <div class="hero-seal" id="hero-seal"></div>
      </div>
      <div class="hero-scroll-hint" id="scroll-hint">
        <span>scroll</span>
        <svg class="scroll-arrow" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <line x1="8" y1="2" x2="8" y2="13" />
          <polyline points="3,9 8,14 13,9" />
        </svg>
      </div>
    </header>

    <main id="main-content">

      <section class="section" id="about">
        <div class="section-inner">
          <div class="vignette" data-vignette="mountain-cluster"></div>
          <h2 class="section-title">About</h2>
          <div class="about-grid">
            <div class="about-portrait">
              <img src="./assets/images/portrait.png" alt="Portrait of Devanshu Singhvi" width="280" height="280" />
            </div>
            <div class="about-text" id="about-text"></div>
          </div>
        </div>
      </section>

      <section class="section" id="experience">
        <div class="section-inner">
          <div class="vignette" data-vignette="lone-pine"></div>
          <h2 class="section-title">Experience</h2>
          <div class="subsection">
            <h3 class="subsection-title">Education</h3>
            <div id="education-list"></div>
          </div>
          <div class="subsection">
            <h3 class="subsection-title">Work</h3>
            <div id="work-list"></div>
          </div>
          <div class="subsection">
            <h3 class="subsection-title">Honours</h3>
            <div id="honours-list"></div>
          </div>
          <div id="resume-mount"></div>
        </div>
      </section>

      <section class="section" id="skills">
        <div class="section-inner">
          <div class="vignette" data-vignette="water-ripples"></div>
          <h2 class="section-title">Skills</h2>
          <div class="skills-grid" id="skills-grid"></div>
        </div>
      </section>

      <section class="section" id="projects">
        <div class="section-inner section-inner--wide">
          <div class="vignette" data-vignette="bamboo"></div>
          <h2 class="section-title">Projects</h2>
          <div class="projects-grid" id="projects-grid"></div>
        </div>
      </section>

      <section class="section" id="teaching">
        <div class="section-inner">
          <div class="vignette" data-vignette="cloud-wisp"></div>
          <h2 class="section-title">Teaching</h2>
          <div class="teaching-list" id="teaching-list"></div>
        </div>
      </section>

      <section class="section" id="contact">
        <div class="section-inner">
          <div class="vignette" data-vignette="mountain-cluster"></div>
          <h2 class="section-title">Contact</h2>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>&copy; <span id="footer-year"></span> Devanshu Singhvi</p>
    </footer>

    <script src="./assets/data/site-data.js"></script>
    <script src="./assets/js/ink-landscape.js"></script>
    <script src="./assets/js/ink-vignettes.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
