<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Devanshu Singhvi. AI engineer and graduate student at the University of Toronto." />
    <meta property="og:title" content="Devanshu Singhvi" />
    <meta property="og:description" content="AI engineer and graduate student at the University of Toronto." />
    <meta property="og:type" content="website" />
    <title>Devanshu Singhvi</title>
    <link rel="shortcut icon" href="./assets/images/berserk.jpg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ink-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <a href="#about" class="skip">Skip to content</a>

    <header class="top">
      <a class="seal" href="#hero" aria-label="Devanshu Singhvi, back to top">DS</a>
      <nav class="nav" id="nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#teaching">Teaching</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero" id="hero">
      <div class="art" id="river-art" aria-hidden="true"></div>

      <div class="title">
        <h1 class="name" id="hero-name" aria-label="Devanshu Singhvi">
          <span class="name-line" data-text="Devanshu">Devanshu</span>
          <span class="name-line" data-text="Singhvi">Singhvi</span>
        </h1>
        <p class="caption caption--solid" id="hero-role">SHIFT AI Engineer @ Next Pathway</p>
        <p class="caption" id="hero-degree">MScAC, Computer Science, University of Toronto</p>
      </div>

      <div class="controls">
        <button id="theme" type="button" aria-pressed="false">Night</button>
        <button id="redraw" type="button">Redraw</button>
      </div>
    </section>

    <main class="flow" id="main">
      <div class="river-layer" id="page-river" aria-hidden="true"></div>

      <section class="sec sec--about" id="about">
        <div class="lane" aria-hidden="true"></div>
        <h2 class="slab">About</h2>
        <div class="card about" data-reveal>
          <img class="about__portrait" src="./assets/images/portrait.png" alt="Portrait of Devanshu Singhvi" width="280" height="280" />
          <div class="about__text prose" id="about-text"></div>
        </div>
      </section>

      <section class="sec sec--experience" id="experience">
        <div class="lane" aria-hidden="true"></div>
        <h2 class="slab">Experience</h2>
        <div class="resume-mount" id="resume-mount"></div>
        <p class="bank bank--edu">Education</p>
        <p class="bank bank--work">Work</p>
        <div class="timeline" id="timeline"></div>
      </section>

      <section class="sec sec--projects" id="projects">
        <div class="lane" aria-hidden="true"></div>
        <h2 class="slab">Projects</h2>
        <div class="proj-big" id="projects-big"></div>
        <div class="proj-small" id="projects-small"></div>
      </section>

      <section class="sec sec--teaching" id="teaching">
        <div class="lane" aria-hidden="true"></div>
        <div class="teaching-head">
          <h2 class="slab">Teaching</h2>
          <p class="card note prose" id="teaching-note" data-reveal></p>
        </div>
        <ul class="stamps" id="teaching-list"></ul>
      </section>

      <section class="sea" id="contact">
        <canvas class="sea__waves" id="sea-waves" aria-hidden="true"></canvas>
        <div class="sea__inner">
          <h2 class="slab slab--invert">Contact</h2>
          <ul class="contact" id="contact-links"></ul>
          <p class="sea__foot">&copy; <span id="footer-year"></span> Devanshu Singhvi</p>
        </div>
      </section>
    </main>

    <script src="./assets/data/site-data.js"></script>
    <script src="./assets/js/vendor/anime.umd.min.js"></script>
    <script src="./assets/js/ink-river.js"></script>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/page-river.js"></script>
  </body>
</html>
